<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FENIX 7 FINAL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{background:#000;color:#fff;padding:15px;font-family:system-ui;text-align:center}
h2{color:gold;border:2px solid gold;border-radius:10px;padding:10px;font-size:18px}
textarea{width:100%;height:120px;background:#111;color:#fff;border:2px solid #333;border-radius:10px;padding:10px;box-sizing:border-box}
button{width:100%;padding:15px;background:gold;color:#000;font-weight:900;font-size:16px;border:0;border-radius:12px;margin:8px 0}
.r{background:#1a1a1a;padding:15px;border-radius:10px;text-align:left;white-space:pre-wrap;min-height:150px;border:1px solid gold;margin-top:10px;font-size:14px}
.st{color:#00ffea;margin:8px;font-weight:bold}
</style>
</head>
<body>
<h2>FENIX 7 FINAL<br>Procesador de Manuscritos</h2>
<input type="file" id="f" accept=".docx,.pdf,.txt" style="width:100%;padding:10px;background:#111;border:2px dashed gold;border-radius:8px;color:#fff">
<div class="st" id="st">1. Sube tu archivo (PDF o Word)</div>
<textarea id="in" placeholder="O pega el texto aquí..."></textarea>
<button onclick="corregir()">✨ 2. CORREGIR TODO</button>
<div class="r" id="out">El texto corregido aparecerá aquí...</div>
<button onclick="descargar()" style="background:#2196F3;color:#fff">💾 3. DESCARGAR EN WORD</button>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let nombreFile="Manuscrito_Limpio";

document.getElementById('f').addEventListener('change', async e=>{
 const file=e.target.files[0]; if(!file) return; nombreFile=file.name.split('.')[0];
 document.getElementById('st').innerText='Leyendo archivo...';
 try{
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='docx'){
    const b=await file.arrayBuffer(); 
    const r=await mammoth.extractRawText({arrayBuffer:b}); 
    document.getElementById('in').value=r.value; 
    document.getElementById('st').innerText='✅ Word leído';
  } else if(ext==='pdf'){
    const b=await file.arrayBuffer(); 
    const pdf=await pdfjsLib.getDocument({data:b}).promise; 
    let full=''; 
    for(let i=1;i<=pdf.numPages;i++){
      document.getElementById('st').innerText='Leyendo PDF pág ' + i + ' de ' + pdf.numPages;
      const pg=await pdf.getPage(i); 
      const c=await pg.getTextContent(); 
      full+=c.items.map(o=>o.str).join(' ')+'\n\n';
    } 
    document.getElementById('in').value=full; 
    document.getElementById('st').innerText='✅ PDF leído';
  } else{ 
    document.getElementById('in').value=await file.text(); 
    document.getElementById('st').innerText='✅ Texto leído';
  }
 }catch(err){document.getElementById('st').innerText='❌ Error: '+err.message;}
});

function corregir(){
 let t=document.getElementById('in').value; 
 if(!t.trim()){alert('Sube un archivo o pega texto');return;}

 // 1. Arreglar guiones de escáner
 t=t.replace(/(\w+)-\s*\n\s*(\w+)/g,'$1$2').replace(/(\w+)-\s+(\w+)/g,'$1$2');
 
 // 2. Unificar NOMBRE (sin tildes en Ángel)
 const NOMBRE='José Alirio Angel Corredor';
 t=t.replace(/José\s+Alirio\s+Ángel\s+Corredor/gi,NOMBRE);
 t=t.replace(/José\s+Alirio\s+Angel\s+Corredor/gi,NOMBRE);
 t=t.replace(/José\s+Ángel/gi,NOMBRE);
 t=t.replace(/José\s+Angel/gi,NOMBRE);
 t=t.replace(/Jose\s+Ángel/gi,NOMBRE);
 t=t.replace(/Jose\s+Angel/gi,NOMBRE);

 // 3. Unificar TÍTULO y SUBTÍTULO
 t=t.replace(/7\s+pisadas\s+sobre\s+una\s+huela/gi,'7 PISADAS UNA HUELLA');
 t=t.replace(/7\s+pisadas\s+una\s+huela/gi,'7 PISADAS UNA HUELLA');
 t=t.replace(/7\s+PISADAS\s+UNA\s+HUELA/gi,'7 PISADAS UNA HUELLA');
 t=t.replace(/arquitectura\s+(el|del)\s+alma/gi,'neuroingeniería del alma');
 t=t.replace(/Neuroingenieria\s+del\s+alma/gi,'neuroingeniería del alma');

 // 4. Correcciones específicas de ortografía y errores del libro
 t=t.replace(/\bHUELILA\b/gi,'HUELLA');
 t=t.replace(/\bCoredor\b/gi,'Corredor');
 t=t.replace(/\boxitocica\b/gi,'oxitocina');
 t=t.replace(/\boxitócica\b/gi,'oxitocina');
 t=t.replace(/\bneguentropia\b/gi,'neguentropía');
 t=t.replace(/\btrastocado\b/gi,'trastornado');
 t=t.replace(/\bdia\b/gi,'día');
 t=t.replace(/\btenia\b/gi,'tenía');
 t=t.replace(/\bhabia\b/gi,'había');

 // 5. Limpieza de espacios
 t=t.replace(/[^\S\n]{2,}/g,' ').replace(/\s+([.,;:!?])/g,'$1');

 document.getElementById('out').innerText=t;
 document.getElementById('st').innerText='✅ CORREGIDO Y LISTO';
}

function descargar(){
 const txt=document.getElementById('out').innerText; 
 if(txt.includes('aparecerá aquí')){alert('Primero corrige el texto');return;}
 const html='<html><head><meta charset="utf-8"></head><body><p style="white-space:pre-wrap">'+txt+'</p></body></html>';
 const blob=new Blob(['\ufeff',html],{type:'application/msword'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombreFile+'_CORREGIDO.doc'; a.click();
}
</script>
</body>
</html>
