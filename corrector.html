<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App Correctora - AngelStudi07</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; text-align: center; }
        h1 { color: #4CAF50; font-size: 24px; }
        textarea { width: 100%; height: 150px; margin-bottom: 15px; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: #1e1e1e; color: #fff; font-size: 16px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; border: none; padding: 15px 32px; text-align: center; display: block; font-size: 18px; margin: 10px 0; cursor: pointer; border-radius: 8px; width: 100%; font-weight: bold; }
        button:active { background-color: #3e8e41; }
        .resultado { background-color: #2c3e50; padding: 15px; border-radius: 8px; min-height: 150px; text-align: left; white-space: pre-wrap; font-size: 16px; margin-top: 15px; border: 1px solid #4CAF50; }
        .contador { font-size: 12px; color: #888; text-align: right; }
        .btn-copiar { background-color: #2196F3; }
    </style>
</head>
<body>
    <h1>Corrector Mágico de Textos</h1>
    <p>Pega tu texto aquí abajo:</p>
    <textarea id="textoSucio" placeholder="Pega aquí el texto con errores..." oninput="actualizarContador()"></textarea>
    <div class="contador" id="contador">0 caracteres</div>
    <button onclick="corregirTexto()">✨ Limpiar Texto</button>
    <p>Texto Corregido (Listo para copiar):</p>
    <div class="resultado" id="textoLimpio">El texto corregido aparecerá aquí...</div>
    <button class="btn-copiar" onclick="copiarTexto()">📋 Copiar Texto Limpio</button>

    <script>
        function actualizarContador() {
            let len = document.getElementById('textoSucio').value.length;
            document.getElementById('contador').innerText = len + ' caracteres';
        }
        function corregirTexto() {
            let texto = document.getElementById('textoSucio').value;
            let correcciones = [
                [/ {2,}/g, ' '], [/\s+([?.!,;:])/g, '$1'],
                [/\bmas\b/gi, 'más'], [/\bahi\b/gi, 'ahí'], [/\bojala\b/gi, 'ojalá'], [/\basi\b/gi, 'así'],
                [/\bAngel\b/g, 'Ángel'], [/\bdia\b/gi, 'día'], [/\baqui\b/gi, 'aquí'], [/\bademas\b/gi, 'además'],
                [/\bdespues\b/gi, 'después'], [/\bexito\b/gi, 'éxito'], [/\bIntuicion\b/gi, 'Intuición'],
                [/\bNeuroingenieria\b/gi, 'Neuroingeniería'], [/\bFormula\b/gi, 'Fórmula'], [/\bFenix\b/gi, 'Fénix'],
                [/\blimite\b/gi, 'límite'], [/\bautentica\b/gi, 'auténtica'], [/\btenia\b/gi, 'tenía'],
                [/\bhabia\b/gi, 'había'], [/\bsentia\b/gi, 'sentía'], [/\bcreia\b/gi, 'creía']
            ];
            for (let i = 0; i < correcciones.length; i++) {
                texto = texto.replace(correcciones[i][0], correcciones[i][1]);
            }
            texto = texto.replace(/---/g, '—');
            document.getElementById('textoLimpio').innerText = texto;
        }
        function copiarTexto() {
            let texto = document.getElementById('textoLimpio').innerText;
            navigator.clipboard.writeText(texto).then(() => { alert('¡Texto copiado! AngelStudi07'); });
        }
    </script>
</body>
</html>
